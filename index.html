<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DHR AI Team - REAL AI</title><style>body{background:#070707;color:#fff;font-family:sans-serif;padding:15px;margin:0}.card{background:#141414;border:2px solid #22c55e;border-radius:16px;padding:15px;margin:10px 0}.btn{background:#22c55e;color:#000;border:none;padding:16px;border-radius:99px;font-weight:900;width:100%;margin:8px 0;font-size:16px;cursor:pointer}.viewer{background:#000;border:1px solid #333;border-radius:12px;padding:12px;margin-top:10px;font-size:13px;min-height:100px;white-space:pre-wrap}</style></head><body>
<h2 style="color:#22c55e;text-align:center">🏔️ DHR AI Team — REAL AI LIVE</h2>
<div class="card" style="border-color:#22c55e;background:linear-gradient(135deg,#0f1a0f,#1a2e1a)"><div style="font-weight:900;color:#22c55e">🔑 REAL AI — 1 TAP LIVE!</div><div style="font-size:11px;color:#aaa;margin-top:4px">Paste key once → Real GPT LIVE!</div>
<input id="key" type="password" placeholder="Paste sk-proj-... here" style="width:100%;background:#000;border:2px solid #22c55e;border-radius:12px;padding:14px;color:#fff;margin-top:10px;text-align:center">
<button class="btn" onclick="saveKey()">✅ SAVE & MAKE REAL AI LIVE</button>
<button class="btn" style="background:#fff" onclick="testAI()">🧪 TEST REAL AI</button>
<div id="res" class="viewer" style="display:none"></div></div>

<div class="card"><div style="font-weight:800">💬 Inbox AI — Real GPT</div>
<input id="from" placeholder="Customer name" style="width:100%;background:#000;border:1px solid #333;border-radius:8px;padding:10px;color:#fff;margin-top:8px">
<input id="msg" placeholder="Customer message: EBC cost?" style="width:100%;background:#000;border:1px solid #333;border-radius:8px;padding:10px;color:#fff;margin-top:6px">
<button class="btn" style="background:#333;color:#fff" onclick="runInbox()">🤖 Real AI Reply</button>
<div id="inboxRes" class="viewer" style="display:none"></div></div>

<div class="card"><div style="font-weight:800">📱 Content AI — Real GPT</div>
<input id="topic" placeholder="Topic: Everest Base Camp" style="width:100%;background:#000;border:1px solid #333;border-radius:8px;padding:10px;color:#fff;margin-top:8px">
<button class="btn" style="background:#333;color:#fff" onclick="runContent()">✨ Real AI Viral Post</button>
<div id="contentRes" class="viewer" style="display:none"></div></div>

<script>
let openaiKey=localStorage.getItem('dhr_openai_key')||'';
document.getElementById('key').value=openaiKey;
async function callAI(prompt,sys){const key=localStorage.getItem('dhr_openai_key');if(!key){alert('Add key first! Get from platform.openai.com/api-keys');return null}const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'system',content:sys},{role:'user',content:prompt}],max_tokens:300})});const d=await r.json();if(d.error)throw new Error(d.error.message);return d.choices[0].message.content}
function saveKey(){const k=document.getElementById('key').value.trim();if(!k.startsWith('sk-')){alert('Key starts with sk-...');return}localStorage.setItem('dhr_openai_key',k);openaiKey=k;alert('✅ REAL AI LIVE! Key saved!');}
async function testAI(){const el=document.getElementById('res');el.style.display='block';el.innerHTML='🧪 Testing Real GPT...';try{const t=await callAI('Write 1-line welcome for Everest Base Camp trek','You are DHR AI');el.innerHTML='✅ REAL AI WORKS! 🎉\n\n'+t+'\n\n● GPT-4o-mini LIVE!'}catch(e){el.innerHTML='❌ '+e.message}}
async function runInbox(){const el=document.getElementById('inboxRes');el.style.display='block';el.innerHTML='🤖 Real AI writing...';try{const from=document.getElementById('from').value||'Customer';const msg=document.getElementById('msg').value||'EBC cost?';const t=await callAI(`Customer ${from} asked: "${msg}". Write short helpful reply with price $3200, includes, ask to book. Under 80 words.`,'You are Inbox AI for DHR Himalayan treks, helpful, business tone');el.innerHTML=t}catch(e){el.innerHTML='❌ '+e.message}}
async function runContent(){const el=document.getElementById('contentRes');el.style.display='block';el.innerHTML='✨ Real AI writing...';try{const topic=document.getElementById('topic').value||'Everest Base Camp';const t=await callAI(`Write viral Instagram post for ${topic} trek, with emojis, hashtags, call to action, 50-80 words, exciting`,'You are Content AI for DHR Instagram, viral, engaging');el.innerHTML=t}catch(e){el.innerHTML='❌ '+e.message}}
</script></body></html>
